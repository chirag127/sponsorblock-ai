name: CI

# Trigger workflow on push events to the main branch
# and on pull request events targeting the main branch.
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'uv'

      - name: Install Dependencies with uv
        run: |
          python -m uv pip install --upgrade pip
          python -m uv pip install ruff pytest
          python -m uv pip install -e .[dev] # Install package in editable mode with dev dependencies

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Test with Pytest
        run: |
          pytest --cov=tubescript --cov-report=xml --cov-report=term --junitxml=test-results.xml

      - name: Upload Coverage Data
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: test-results.xml
          retention-days: 7

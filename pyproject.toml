[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sponsorblock-ai"
version = "1.0.0"
description = "ML sponsor-segment detection for YouTube: ModernBERT window classifier trained on the SponsorBlock database, with yt-dlp transcript ingestion, a training/finetune pipeline, and a Streamlit demo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chirag Singhal" }]
keywords = ["sponsorblock", "youtube", "transformers", "modernbert", "text-classification", "ml", "nlp"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "transformers>=4.48.0",
  "torch>=2.4.0",
  "datasets>=3.2.0",
  "yt-dlp>=2025.1.1",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.5.0",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "typer>=0.15.0",
  "rich>=13.9.0",
]

[project.optional-dependencies]
train = ["accelerate>=1.2.0", "evaluate>=0.4.3", "seqeval>=1.2.2"]
app = ["streamlit>=1.41.0"]
dev = ["pytest>=8.3.0", "pytest-cov>=6.0.0", "ruff>=0.9.0", "respx>=0.22.0"]

[project.scripts]
sponsorblock-ai = "sponsorblock_ai.cli:app"

[project.urls]
Homepage = "https://github.com/chirag127/sponsorblock-ai"
Repository = "https://github.com/chirag127/sponsorblock-ai"
Live = "https://sponsorblock-ai.oriz.in"

[tool.hatch.build.targets.wheel]
packages = ["src/sponsorblock_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer.Option in defaults is the canonical Typer pattern
